[package]
name = "winstt-context-sidecar"
version = "0.1.3-alpha.7"
description = "Native focused-field context helper for WinSTT"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "winstt_context"
path = "../src/bin/winstt_context.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# The release wrapper builds this lightweight target before Tauri so ort-sys can
# materialize DirectML.dll for package staging without compiling the full app
# twice. The sidecar itself does not call ORT, but clean Windows runners require
# this build-time dependency to produce the app's DirectML runtime payload.
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
# Keep this feature set aligned with the app manifest. Because both manifests use
# the same target directory and profile, Cargo can reuse the already-built Windows
# projection instead of compiling a second feature variant for this small helper.
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Audio",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Dxgi",
  "Win32_System_Console",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Globalization",
  "Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.30"
tokio = { version = "1.43.0", features = ["rt"] }
zbus = "5"
