# Dependency update automation. Minor/patch bumps are grouped into a single PR
# per ecosystem to keep the queue quiet; majors stay individual so breaking
# changes get reviewed on their own.
version: 2
updates:
  # Renderer (root package.json + bun.lock). The npm ecosystem refuses to
  # touch bun.lock ("Bun is misconfigured"), so use Dependabot's bun ecosystem.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # TanStack Table v9 is a ground-up API redesign (feature registration,
      # new ColumnMeta generics) that breaks the whole shared data-grid; v8 is
      # maintained and sufficient. Migrate deliberately, not via Dependabot.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Rust backend crate.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # windows-core must match the `windows` crate's version (its COM traits
      # are what `#[implement]` and the generated interfaces bind to). It
      # publishes ahead of `windows`, so a lone bump breaks every COM impl —
      # move it by hand together with `windows`.
      - dependency-name: "windows-core"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The workflows themselves — keeps the SHA pins fresh as upstream actions
  # tag new releases.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
