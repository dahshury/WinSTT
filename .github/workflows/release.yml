name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Leave the GitHub release as a draft after all assets upload"
        required: true
        type: boolean
        default: false
  workflow_run:
    workflows: ["Rust CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      draft: ${{ steps.gate.outputs.draft }}
      should_publish: ${{ steps.gate.outputs.should_publish }}
      tag: ${{ steps.gate.outputs.tag }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate version
        id: version
        run: |
          set -euo pipefail

          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          package_version="$(jq -r '.version' package.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"

          if [ "$version" != "$package_version" ] || [ "$version" != "$cargo_version" ]; then
            echo "::error::Version mismatch: tauri=$version package=$package_version cargo=$cargo_version"
            exit 1
          fi

          if [[ "$version" != *"-alpha"* ]]; then
            echo "::error::Alpha-only release policy is active; version must include -alpha. Got: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify README download badges are current
        run: node tools/release/sync-readme-download-badges.mjs --check

      - name: Decide release mode
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRAFT_INPUT: ${{ inputs.draft || false }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name || '' }}
        run: |
          set -euo pipefail

          tag="v$VERSION"
          draft="$RELEASE_DRAFT_INPUT"
          should_publish="true"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            draft="false"

            if [ "$WORKFLOW_RUN_NAME" != "Rust CI" ] ||
               [ "$WORKFLOW_RUN_EVENT" != "push" ] ||
               [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
              echo "Automatic release skipped for workflow '$WORKFLOW_RUN_NAME' event '$WORKFLOW_RUN_EVENT' conclusion '$WORKFLOW_RUN_CONCLUSION'."
              should_publish="false"
            elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Automatic release skipped because $tag already exists."
              should_publish="false"
            else
              ci_success_count="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow ci.yml \
                  --commit "$TARGET_SHA" \
                  --json status,conclusion \
                  --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length'
              )"

              if [ "$ci_success_count" -eq 0 ]; then
                echo "::error::Cannot publish $tag automatically: CI has not completed successfully for $TARGET_SHA."
                exit 1
              fi
            fi
          fi

          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows portable artifacts
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: release-windows-x64

      - name: Reset stale native build cache
        shell: pwsh
        run: |
          $paths = @(
            "src-tauri\target\sherpa-onnx-prebuilt",
            "src-tauri\target\debug\build\sherpa-onnx-*",
            "src-tauri\target\debug\.fingerprint\sherpa-onnx-*",
            "src-tauri\target\release\build\sherpa-onnx-*",
            "src-tauri\target\release\.fingerprint\sherpa-onnx-*",
            "src-tauri\target\debug\build\ort-sys-*",
            "src-tauri\target\debug\.fingerprint\ort-sys-*",
            "src-tauri\target\release\build\ort-sys-*",
            "src-tauri\target\release\.fingerprint\ort-sys-*"
          )
          foreach ($path in $paths) {
            Remove-Item -Recurse -Force $path -ErrorAction SilentlyContinue
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install renderer dependencies
        shell: pwsh
        run: |
          bun install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            bun pm cache rm
            bun install --frozen-lockfile --ignore-scripts
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Tauri release binary
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY.TrimStart([char]0xFEFF)
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD.TrimStart([char]0xFEFF).TrimEnd("`r", "`n")
          }
          tools\windows\tauri-build.ps1 -Bundles nsis -Config tools\tauri-ci-artifacts.conf.json

      - name: Collect portable Windows artifacts
        shell: pwsh
        run: tools\windows\tauri-portable.ps1 -SkipBuild

      - name: Enforce main-window startup bundle budget
        run: bun run check:startup-bundle

      - name: Audit Windows package contents and headless boot
        shell: pwsh
        run: tools\release\audit-windows-packages.ps1

      - name: Upload Windows artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winstt-windows-x64
          if-no-files-found: error
          path: |
            dist/WinSTT.exe
            dist/WinSTT-portable.zip
            src-tauri/target/release/bundle/nsis/*.sig

  linux:
    name: Build Linux bundle artifacts
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}

      - name: Install Linux Tauri dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -e "$source" ] || continue
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
          done

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            install -y --no-install-recommends \
            build-essential \
            curl \
            cpio \
            file \
            fuse \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm \
            wget \
            xdg-utils

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: release-linux-x64

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install renderer dependencies
        run: |
          bun install --frozen-lockfile || {
            bun pm cache rm
            bun install --frozen-lockfile
          }

      - name: Build Linux artifacts
        run: bash tools/linux/tauri-bundles.sh

      - name: Enforce main-window startup bundle budget
        run: bun run check:startup-bundle

      - name: Audit Linux package contents and headless boot
        run: bash tools/release/audit-linux-packages.sh

      - name: Upload Linux artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winstt-linux-x64
          if-no-files-found: error
          path: dist/linux/*

  macos:
    name: Build macOS bundle artifacts (${{ matrix.arch }})
    needs: metadata
    if: needs.metadata.outputs.should_publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"
          key: release-macos-${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install renderer dependencies
        run: |
          bun install --frozen-lockfile || {
            bun pm cache rm
            bun install --frozen-lockfile
          }

      - name: Build macOS artifacts
        run: bash tools/macos/tauri-bundles.sh "${{ matrix.target }}" "${{ matrix.arch }}"

      - name: Enforce main-window startup bundle budget
        run: bun run check:startup-bundle

      - name: Audit macOS package contents and headless boot
        run: bash tools/release/audit-macos-packages.sh "dist/macos/${{ matrix.arch }}"

      - name: Upload macOS artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winstt-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/macos/${{ matrix.arch }}/*

  publish:
    name: Upload assets to GitHub release
    needs: [metadata, windows, linux, macos]
    if: needs.metadata.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.target_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.metadata.outputs.target_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $previousTag = git tag --list "v*" --sort=-creatordate |
            Where-Object { $_ -ne $tag } |
            Select-Object -First 1

          $noteArgs = @(
            "api",
            "repos/$env:GITHUB_REPOSITORY/releases/generate-notes",
            "--method",
            "POST",
            "--field",
            "tag_name=$tag",
            "--field",
            "target_commitish=$env:TARGET_SHA",
            "--jq",
            ".body"
          )
          if ($previousTag) {
            $noteArgs += @("--field", "previous_tag_name=$previousTag")
            Write-Host "Generating release notes for $tag from $previousTag."
          } else {
            Write-Host "Generating release notes for $tag without a previous tag."
          }

          $range = if ($previousTag) { "$previousTag..HEAD" } else { "HEAD" }
          $changeLines = @(git log $range --pretty=format:"- %s (%h)")
          if ($LASTEXITCODE -ne 0) {
            throw "git log $range failed with exit code $LASTEXITCODE"
          }
          if ($changeLines.Count -eq 0) {
            $changeLines = @("- Maintenance release.")
          }

          $generatedNotes = @(& gh @noteArgs)
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release notes generation failed with exit code $LASTEXITCODE"
          }

          $sinceTitle = if ($previousTag) { "## Changes since $previousTag" } else { "## Changes in this release" }
          @(
            "# WinSTT $env:VERSION",
            "",
            $sinceTitle,
            "",
            $changeLines,
            "",
            $generatedNotes
          ) | Set-Content -LiteralPath release-notes.md -Encoding utf8

          if ((Get-Item -LiteralPath release-notes.md).Length -eq 0) {
            throw "GitHub release notes generation returned an empty body."
          }

      - name: Create or update release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRAFT: ${{ needs.metadata.outputs.draft }}
          TARGET_SHA: ${{ needs.metadata.outputs.target_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $draft = [System.Convert]::ToBoolean($env:RELEASE_DRAFT)
          $prerelease = $true
          $notes = Get-Content -LiteralPath release-notes.md -Raw
          tools/release/upload-github-assets.ps1 `
            -AssetsRoot release-assets `
            -Version $env:VERSION `
            -Notes $notes `
            -Target $env:TARGET_SHA `
            -Prerelease:$prerelease `
            -Draft:$draft
