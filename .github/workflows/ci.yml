name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages/**"
      - "test/**"
      - "messages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "knip.json"
      - "tools/i18n/**"
      - "tools/windows/**"
      - "tools/linux/**"
      - "tools/macos/**"
      - "tools/perf/check-startup-bundle.mjs"
      - "tools/release/audit-*-packages.*"
      - "tools/tauri-ci-artifacts.conf.json"
      - "src-tauri/**"
      - "vite.config.ts"
      - "biome.jsonc"
      - "tsconfig*"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "packages/**"
      - "test/**"
      - "messages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "knip.json"
      - "tools/i18n/**"
      - "tools/windows/**"
      - "tools/linux/**"
      - "tools/macos/**"
      - "tools/perf/check-startup-bundle.mjs"
      - "tools/release/audit-*-packages.*"
      - "tools/tauri-ci-artifacts.conf.json"
      - "src-tauri/**"
      - "vite.config.ts"
      - "biome.jsonc"
      - "tsconfig*"
      - ".github/workflows/ci.yml"

# Cancel superseded runs on the same ref. PR pushes especially benefit
# — a fresh commit obsoletes the prior pipeline immediately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Renderer (src/) lint + i18n parity + build. The Rust + Tauri port's
  # renderer lives in src/ — the old jobs targeted the now-deleted reference
  # frontend/ + server/ dirs. Backend (src-tauri/) CI is in rust-ci.yml.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # Bun's install cache. Keyed on bun.lock so a dep bump invalidates
      # cleanly; the restore-keys prefix reuses cache layers across lockfile
      # changes within the same OS image.
      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome (lint + format, via Ultracite) over src/ + repo config, plus the
      # standalone `no-literal-string` scanner that keeps the JSX untranslated-text
      # guard (no Biome equivalent). `bun run lint` = `biome check . && bun
      # tools/i18n/check-no-literal-string.ts`, so this one step also enforces
      # formatting — no separate Prettier check needed.
      - name: Lint + format (Biome + i18n literal guard)
        run: bun run lint

      - name: TypeScript typecheck
        run: bun run typecheck

      # Renderer + model-picker unit/integration suite. `bun run test` fans out
      # across src/ slices and packages/ — gating it here means a red test can
      # no longer merge green (the suite was a manual-only net before).
      - name: Unit tests
        run: bun run test

      - name: Dead-code check
        run: bun run check:deadcode

      # i18n key parity across all 20 locale baselines vs messages/en.json.
      # Default mode (no --strict) only fails on missing keys, not on
      # English-equal values, so seeded baselines still pass.
      - name: i18n parity check
        run: bun run check:i18n

      # Renderer bundle smoke. `build` re-runs the tsc typecheck as part of the
      # local developer contract; the explicit typecheck step above gives CI a
      # focused TypeScript failure before the bundle work starts.
      - name: Build renderer
        run: bun run build
