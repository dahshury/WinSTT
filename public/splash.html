<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="/icon.png">
		<title>WinSTT</title>
		<style>
			:root {
				--color-splash-shadow: rgba(22, 12, 55, 0.48);
				--color-splash-shadow-transparent: rgba(22, 12, 55, 0);
				--color-splash-text: rgba(255, 255, 255, 0.96);
				--color-splash-text-shadow: rgba(0, 0, 0, 0.92);
				--color-splash-accent-glow: rgba(104, 166, 255, 0.38);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				background: transparent;
				cursor: default;
				-webkit-user-select: none;
				user-select: none;
			}

			body {
				display: grid;
				place-items: center;
			}

			.mark {
				position: relative;
				width: 168px;
				height: 168px;
				filter: drop-shadow(0 12px 22px var(--color-splash-shadow));
			}

			.mark__image,
			.mark__color {
				position: absolute;
				inset: 0;
			}

			.mark__image {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: contain;
				pointer-events: none;
			}

			.mark__image--mono {
				filter: grayscale(1) saturate(0) brightness(0.78) contrast(0.92);
				opacity: 0.78;
			}

			.mark__color {
				width: 0%;
				overflow: hidden;
				transition: width 280ms cubic-bezier(0.22, 1, 0.36, 1);
			}

			.mark__color .mark__image {
				width: 168px;
				max-width: none;
			}

			.mark__percent {
				position: absolute;
				top: 49%;
				left: 50%;
				z-index: 1;
				min-width: 72px;
				color: var(--color-splash-text);
				font-family: "Cascadia Mono", "Cascadia Code", ui-monospace, monospace;
				font-size: 27px;
				font-weight: 650;
				font-variant-numeric: tabular-nums;
				letter-spacing: -0.08em;
				line-height: 1;
				text-align: center;
				text-shadow:
					0 2px 8px var(--color-splash-text-shadow),
					0 0 14px var(--color-splash-accent-glow);
				transform: translate(-50%, -50%);
			}

			body.is-closing .mark {
				animation: splash-out 180ms ease-in forwards;
			}

			@keyframes splash-out {
				to {
					opacity: 0;
					filter: blur(2px)
						drop-shadow(0 4px 8px var(--color-splash-shadow-transparent));
					transform: translateY(-4px) scale(0.92);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.mark,
				.mark__color {
					animation: none !important;
					transition: none !important;
				}
			}
		</style>
	</head>
	<body>
		<div
			class="mark"
			id="splash-progress"
			role="progressbar"
			aria-label="Starting WinSTT"
			aria-valuemin="0"
			aria-valuemax="100"
			aria-valuenow="0"
		>
			<img class="mark__image mark__image--mono" src="/splash-icon.png" alt="">
			<div class="mark__color bar" aria-hidden="true">
				<img class="mark__image" src="/splash-icon.png" alt="">
			</div>
			<output class="mark__percent" id="progress-text">0%</output>
		</div>
	</body>
</html>
